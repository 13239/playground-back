# dev는 Docker의 내부 HTTP 통신용 독립 설정이다. Spring 포트는 호스트에 공개하지 않는다.
server.port=${SERVER_PORT:9080}
server.address=0.0.0.0
server.ssl.enabled=false
# 로그인 IP의 신뢰 여부는 실제 연결 상대를 기준으로 판단하므로 전달 헤더로 remoteAddr를 변경하지 않는다.
server.forward-headers-strategy=none

# Docker의 DB·Redis 서비스 주소를 환경 변수로 공급한다. 로컬 비밀번호를 기본값으로 사용하지 않는다.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
# 개발 서버도 SQL 바인딩 값의 자격 증명·개인정보를 로그에 남기지 않는다.
decorator.datasource.p6spy.enable-logging=false

# dev의 HTTP 예외는 별도 BFF 인증 키가 필수다. 운영 prod에서는 이 인증 방식을 허용하지 않는다.
auth.bff.mtls-required=false
auth.bff.dev-shared-secret=${BFF_DEV_SHARED_SECRET}
# 원격 HTTP 개발 서버는 브라우저 개인키 API를 쓸 수 없다. 사용자 승인에 따라 dev에서만 요청 서명을 생략한다.
auth.proof.required=false
auth.proof.origin=${APP_ORIGIN}
auth.proof.max-pending=120
auth.proof.login-max-pending=600
# 등록한 BFF는 외부 헤더를 제거한 후 단일 X-Real-IP를 반드시 전달해야 한다.
# Docker IP가 바뀌면 신뢰 목록도 갱신한다. 비워 두면 실제 연결 IP로 제한한다.
auth.client-ip.trusted-proxies=${AUTH_TRUSTED_PROXY_IPS:}

# jwt: 로컬·운영과 다른 키를 공급하며 Access Token 만료와 활동 기반 세션 만료를 구분한다.
jwt.issuer=${JWT_ISSUER:playground-back-dev}
jwt.audience=${JWT_AUDIENCE:playground-api}
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}

# 로그인 세션: 실제 활동마다 연장하며 로그인 시각 기준 절대 최대 수명은 두지 않는다.
auth.session.remember-ttl=14d
auth.session.idle-ttl=3h
# 계정별 로그인 시도 제한: 첫 시도부터 15분 동안 최대 5회, 로그인 성공 시 초기화
auth.login-rate-limit.account-max-attempts=5
auth.login-rate-limit.account-window=15m
# IP별 로그인 시도 제한: 실패·진행 중 요청은 첫 시도부터 1분간 최대 120회, 성공한 요청의 예약만 반환
auth.login-rate-limit.ip-max-attempts=120
auth.login-rate-limit.ip-window=1m
