# prod는 공통 파일 없이 독립적으로 실행한다. 실제 인증서는 비밀 파일로 마운트한다.
# 인증서가 없으면 HTTPS/mTLS를 완화하지 않고 시작 또는 요청을 거절한다.
server.port=${SERVER_PORT:9080}
server.address=0.0.0.0
server.ssl.enabled=true
server.ssl.enabled-protocols=TLSv1.3
server.ssl.bundle=backend
server.ssl.client-auth=need
spring.ssl.bundle.pem.backend.keystore.certificate=${BACKEND_TLS_CERT}
spring.ssl.bundle.pem.backend.keystore.private-key=${BACKEND_TLS_KEY}
spring.ssl.bundle.pem.backend.truststore.certificate=${BFF_CLIENT_CA}
auth.bff.mtls-required=true
auth.bff.allowed-cert-sha256=${AUTH_BFF_ALLOWED_CERT_SHA256}
auth.proof.origin=${APP_ORIGIN}
auth.proof.required=true
auth.proof.max-pending=120
auth.proof.login-max-pending=600
# 프록시 전달 헤더를 원격 주소로 바꾸지 않는다. 실제 mTLS BFF 주소만 IP 전달을 신뢰한다.
server.forward-headers-strategy=none
auth.client-ip.trusted-proxies=${AUTH_TRUSTED_PROXY_IPS}
# 운영 연결 정보는 필수 환경 변수로 공급한다. 로컬 자격 증명으로 대체하지 않는다.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
# 운영 토큰 기간은 로컬 테스트 기간과 분리한다. 짧은 Access Token도 활동 중 세션의 최대 수명을 만들지 않는다.
jwt.issuer=${JWT_ISSUER:playground-back}
jwt.audience=${JWT_AUDIENCE:playground-api}
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
auth.session.remember-ttl=14d
auth.session.idle-ttl=3h
# 계정별 로그인 시도 제한: 첫 시도부터 15분 동안 최대 5회, 로그인 성공 시 초기화
auth.login-rate-limit.account-max-attempts=5
auth.login-rate-limit.account-window=15m
# IP별 로그인 시도 제한: 실패·진행 중 요청은 첫 시도부터 1분간 최대 120회, 성공한 요청의 예약만 반환
auth.login-rate-limit.ip-max-attempts=120
auth.login-rate-limit.ip-window=1m
# 운영 실행으로 DB 스키마를 변경하지 않는다. 변경된 스키마는 별도 배포 절차로 적용한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# 운영 SQL 바인딩 값에 자격 증명·개인정보가 남지 않도록 p6spy SQL 출력을 비활성화한다.
decorator.datasource.p6spy.enable-logging=false
